# Decided 2026-10-05 (the owner): UniProt is one source, uniprot (Swiss-Prot and the UniProt
# vocabularies, each file mapped to its graph on sparql.uniprot.org); evidence in
# article/corpus/agent-findings/uniprot-whole.md.
- left: uniprot.citationmapping
  right: uniprot
  relation: graph_scope_of
  note: >-
    citation_mapping.rdf.xz is in http://sparql.uniprot.org/citationmapping on the endpoint
    (checked 2026-10-05); uniprot indexes and mines it with its other graphs.
- left: uniprot.citations
  right: uniprot
  relation: graph_scope_of
  note: >-
    citations.rdf.xz is in http://sparql.uniprot.org/citations on the endpoint (checked
    2026-10-05); uniprot indexes and mines it with its other graphs.
- left: uniprot.database
  right: uniprot
  relation: graph_scope_of
  note: >-
    databases.rdf.xz is in http://sparql.uniprot.org/database on the endpoint (checked
    2026-10-05); uniprot indexes and mines it with its other graphs.
- left: uniprot.diseases
  right: uniprot
  relation: graph_scope_of
  note: >-
    diseases.rdf.xz is in http://sparql.uniprot.org/diseases on the endpoint (checked
    2026-10-05); uniprot indexes and mines it with its other graphs.
- left: uniprot.enzymes
  right: uniprot
  relation: graph_scope_of
  note: >-
    enzyme.rdf.xz is in http://sparql.uniprot.org/enzymes on the endpoint (checked 2026-10-05);
    uniprot indexes and mines it with its other graphs.
- left: uniprot.go
  right: uniprot
  relation: graph_scope_of
  note: >-
    go.owl.xz and go-hierarchy.owl.xz are in http://sparql.uniprot.org/go on the endpoint
    (checked 2026-10-05), an ontology graph of uniprot; not mined (owner, 2026-10-02).
- left: uniprot.core
  right: uniprot
  relation: graph_scope_of
  note: >-
    core.owl is in http://purl.uniprot.org/core/ on the endpoint (checked 2026-10-05), an ontology
    graph of uniprot.
- left: uniprot.chebi
  right: uniprot
  relation: graph_scope_of
  note: >-
    http://sparql.uniprot.org/chebi is an ontology graph of uniprot, indexed from Rhea's
    chebi.owl.gz on Expasy's FTP, whose sampled triples equal the graph (checked 2026-10-05).
    Its identity stays chebi (distribution_of).
- left: uniprot.uniparc
  right: uniprot
  relation: graph_scope_of
  note: >-
    http://sparql.uniprot.org/uniparc is a data graph of uniprot, indexed as a sample
    (uniparc_p1.rdf.xz; sampled_graphs) and counted whole from the endpoint's VoID (owner,
    2026-10-05).
- left: rdfportal.uniprot
  right: uniprot
  relation: distribution_of
  note: >-
    RDF Portal's SIB endpoint mirrors UniProt's RDF under its sparql.uniprot.org graph names; its
    download is the core ontology only (core.nt.gz). Not mined (owner, 2026-10-05: "drop
    rdfportal uniprot").
- left: bio2rdf.uniprot
  right: uniprot
  relation: same_upstream
  note: >-
    Different RDF conversions of the same upstream resource; kept as separate datasets.
- left: earthmetabolome
  right: emi
  relation: version_of
  newer: emi
  note: >-
    Two releases of METRIN-KG on Zenodo, one concept record (15689186): earthmetabolome
    downloads record 15689187 (2025-06-18), emi record 18652487 (2026-02-16; checked
    2026-10-06). The corpus selection mines one of them: the one whose inputs are on disk.
- left: rdfportal.mesh
  right: mesh.nlm
  relation: version_of
  newer: mesh.nlm
  note: >-
    Two yearly releases of NLM MeSH: rdfportal.mesh holds MeSH 2025 (15,349,035 triples, equal to
    the endpoint's /mesh/2025 graph), mesh.nlm the 2026 dump (checked 2026-10-06). Only the newer
    release is mined.
- left: mesh.heading
  right: mesh.nlm
  relation: same_upstream
  note: >-
    Not the same data, nor a part of it (checked 2026-10-06). IDSM's graph
    http://id.nlm.nih.gov/mesh/heading (18,334,011 triples) is a copy of NLM's cumulative graph
    http://id.nlm.nih.gov/mesh (18.35 M on NLM's endpoint): every record carries meshv:active
    (2,365,878 true = the rdf:type count of NLM's /mesh/2024 graph; 91,031 false), and inactive
    records carry meshv:lastActiveYear (2015-2023). mesh.nlm is the yearly 2026 dump (15.36 M),
    in which meshv:active and meshv:lastActiveYear do not occur, so its local index does not
    cover this graph's schema.
- left: biobricks-mesh
  right: mesh.nlm
  relation: same_upstream
  note: >-
    BioBricks MeSH (18,198,108 triples, checked 2026-10-06) is also a copy of NLM's cumulative
    graph (meshv:active on 2,437,645 records), not of the yearly dump that mesh.nlm indexes.
- left: biobricks-mesh
  right: mesh.heading
  relation: version_of
  newer: mesh.heading
  note: >-
    Two copies of NLM's cumulative MeSH graph taken at different releases (18,198,108 and
    18,334,011 triples, checked 2026-10-06). Neither states its release; the data does:
    meshv:lastActiveYear runs to 2022 in BioBricks (2,347,776 active records), so MeSH 2023,
    and to 2023 in IDSM (2,365,878 active), so MeSH 2024.
- left: mesh.heading
  right: mesh.nlm.cumulative
  relation: distribution_of
  note: >-
    IDSM's graph http://id.nlm.nih.gov/mesh/heading is NLM's cumulative graph at the MeSH 2024
    release, the release of NLM's dump mesh.nt.gz (2023-12-18) that mesh.nlm.cumulative
    indexes. Per predicate the two are equal (checked 2026-10-06), save 9 triples of the dump
    that have meshv:Concept as predicate and 14 rdfs:label triples (18,334,034 in the dump,
    18,334,011 on IDSM); meshv:active true/false 2,365,878/91,031 and meshv:lastActiveYear
    2015-2023 are equal year by year.
- left: biobricks-mesh
  right: mesh.nlm.cumulative
  relation: version_of
  newer: mesh.nlm.cumulative
  note: >-
    BioBricks MeSH is NLM's cumulative graph at the MeSH 2023 release (meshv:lastActiveYear up
    to 2022; 18,198,108 triples, checked 2026-10-06); mesh.nlm.cumulative indexes NLM's dump of
    that graph at the MeSH 2024 release (lastActiveYear up to 2023).
- left: mesh.nlm.cumulative
  right: mesh.nlm
  relation: same_upstream
  note: >-
    Two graphs of NLM's MeSH: the cumulative graph http://id.nlm.nih.gov/mesh (records no longer
    active kept, with meshv:active and meshv:lastActiveYear; local dump at MeSH 2024) and the
    yearly graph of MeSH 2026 (active records only). Neither holds the other.
- left: mesh
  right: mesh.nlm.cumulative
  relation: same_upstream
  note: >-
    Different RDF conversions of the same upstream resource; kept as separate datasets.
- left: rdfportal.mesh
  right: mesh.nlm.cumulative
  relation: same_upstream
  note: >-
    RDF Portal's MeSH 2025 is a yearly graph (active records only); mesh.nlm.cumulative is NLM's
    cumulative graph. Neither holds the other.

- left: biobricks-aopwiki
  right: aopwikirdf
  relation: same_upstream
  note: >-
    BioBricks AOP-Wiki is built from AOPWikiRDF (BioBricks' okn-registry provenance names
    marvinm2/AOPWikiRDF as its source); its build repository is not public, so which AOPWikiRDF
    release it copies is not known (184,333 triples at FRINK v0.0.4, checked 2026-10-06).
- left: biobricks-pubchem-annotations
  right: pubchem.ftp
  relation: same_upstream
  note: >-
    BioBricks PubChem Annotations is BioBricks' RDF of PubChem's PUG-View annotation tables
    (pubchem-annotations-kg, annotations.hdt, 87,425,612 triples), not PubChem's own RDF.
- left: ruralkg.sail
  right: ruralkg
  relation: version_of
  newer: ruralkg
  note: >-
    The team's GitHub Turtle (757,242 triples, commit of 2025-02-05) and FRINK's KG Fabric v0.2.10
    (885,098 triples, served at apps.okn.us/ruralkg) are two releases of SAIL-UA's Rural KG
    (same sail.ua.edu/ruralkg namespaces; checked 2026-10-06).
- left: biomarkerkb.reviewed
  right: biomarker
  relation: same_upstream
  note: >-
    BiomarkerKB's own N-Triples (release 3.6.1, 608,166 triples, OBCI predicates only) and FRINK's
    biomarkerkg (v0.0.3, 1,215,057 triples, with rdfs:label, rdf:type and dct:source added) are two
    RDF builds of BiomarkerKB's reviewed biomarkers; neither holds the other (checked 2026-10-06).
