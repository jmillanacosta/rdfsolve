# Curated relations between registry entries.
#
# Each item decides one pair. It overrides the structural rules and any
# candidate listed in identity_review.tsv. Relations:
#   same_dataset     one published RDF dataset under two registry names
#   distribution_of  another endpoint or dump of the same published RDF dataset
#   same_upstream    a different RDF dataset built from the same upstream resource
#   version_of       another release of the same resource
#   graph_scope_of   left is a graph subset of right on the same endpoint
#   distinct         different datasets
# same_dataset and distribution_of join entries into one canonical dataset.
#
# Example:
# - left: oma
#   right: omabrowser
#   relation: same_dataset
#   note: Same OMA SPARQL service under two endpoint paths.
- left: oma
  right: omabrowser
  relation: same_dataset
  note: >-
    /lode/sparql and /sparql/ on sparql.omabrowser.org are one Virtuoso service;
    both returned the same named graphs on 2026-09-18.
- left: string
  right: stringdb
  relation: same_dataset
  note: >-
    / and /sparql on sparql.string-db.org are one Virtuoso service; both
    returned the same named graphs on 2026-09-18.

- left: rdfportal.icgc
  right: rdfportal.linked_icgc
  relation: same_dataset
  note: >-
    Owner decision, 2026-09-22: one dataset at the declared release_20 graph.
    Retain both names and their catalogue and rdf-config provenance.
- left: rdfportal.ensembl
  right: rdfportal.ensembl_grch37
  relation: version_of
  note: >-
    Owner decision, 2026-09-22: retain the release 115 and GRCh37 release 75
    distinction. Verify extraction scopes before extraction; their identical
    declared endpoint and graph remain unresolved.
- left: rdfportal.jpost
  right: rdfportal.mbgd
  relation: distinct
  note: >-
    Owner decision, 2026-09-22: distinct datasets with the shared
    http://rdfportal.org/ontology/taxonomy graph retained as companion scope.
- left: rdfportal.jpost
