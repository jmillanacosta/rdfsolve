  sampled_graphs:
    http://sparql.uniprot.org/uniparc: >-
      Sample: uniparc_p1.rdf.xz only, 1 of the 201 uniparc_p* files of release 2026_03 (6.0 GB of
      xz). The endpoint's VoID states the whole graph.
    http://sparql.uniprot.org/uniprot: >-
      Sample: UniProtKB reviewed (Swiss-Prot) only, the 33 uniprotkb_reviewed_* files of release
      2026_03; the 222 uniprotkb_unreviewed_* (TrEMBL) files are left out. The endpoint's VoID
      states the whole graph.
    http://sparql.uniprot.org/uniref: >-
      Sample: uniref50_0, uniref90_0 and uniref100_0.rdf.xz, the first of the 9, 12 and 15 files
      of UniRef50, UniRef90 and UniRef100 of release 2026_03. The endpoint's VoID states the whole
      graph.
  graph_settings:
    https://sparql.rhea-db.org/rhea:
      # Rhea's reactions are classes, as in the rhea entry; the graph is mined on its own with
      # this setting for its per-graph schema, and the other graphs keep the VoID-first reading.
      classes_as_data: true
