  - biology
  - protein
  - sequence
  - taxonomic classification
  kg_registry_id: uniprot
  notes: >-
    Every named graph that the service description of sparql.uniprot.org names, except its service
    graph .well-known/sparql-examples, indexed and mined as one source (2026-10-05). UniProt
    release 2026_03 (FTP current_release of 2026-09-03; the endpoint answers X-Release 2026_03). The
    large graphs are sampled (sampled_graphs): uniprot (Swiss-Prot), uniparc and uniref; every other
    graph is complete, obsolete included (all 34 uniprotkb_obsolete_entries files). Their full
    counts come from the endpoint's VoID (the remote record). Rhea (release 142) and ChEBI are
    Rhea's RDF files on Expasy's FTP: sampled triples of both equal the endpoint's graphs, while
    EBI's chebi.owl differs (other synonym properties, identifiers and SMILES). These files are
    replaced at each Rhea release, which follows the UniProt release cycle. The core ontology is in
    http://purl.uniprot.org/core/ on the endpoint; its service description names
    http://purl.uniprot.org/core, which is empty. keywords-, locations-, pathways- and enzyme-
    hierarchy.rdf.xz are published empty in this release. The release VoID (void.rdf) is in no graph
    of the endpoint and is recorded in uniprot.schema. The per-graph schemas are named
    uniprot.<last segment of the graph IRI> (rdfsolve.graph_parts): uniprot.citationmapping,
    citations, database, diseases, enzymes and uniparc, which are also graph-scope entries, and
    uniprot.journal, keywords, locations, obsolete, pathways, proteomes, taxonomy, tissues, uniprot
    (UniProtKB, sampled to Swiss-Prot), uniref and rhea, which are not. Evidence:
    article/corpus/agent-findings/uniprot-whole.md.
  science_area: life sciences
