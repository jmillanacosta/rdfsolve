  bioregistry_prefix: pubchem
  keywords:
  - bibliography/documents
  - chemical
  - chemical compound
  - chemical structure
  - compound
  - metabolite
  - method
  - protein
  - structure
  source_role: service
  notes: Publisher VoID and SHACL documents for PubChem. These are declared schema artifacts.
