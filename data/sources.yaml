- name: pubchem.qlever
  source_role: service
  endpoint: https://qlever.dev/api/pubchem
  sparql_engine: qlever
  supports_graph: true
  bioregistry_prefix: pubchem
  notes: >-
    QLever provider view of PubChem, separate from the IDSM provider view.
    This service is an access record, not another dataset in corpus counts.
    Local reproduction uses the PubChem FTP distributions plus the external
    ontology bundle specified by the QLever PubChem recipe:
    https://github.com/qlever-dev/qlever-control/blob/aca6208a03982216f182087044796169fde282ec/src/qlever/Qleverfiles/Qleverfile.pubchem.
    The recipe uses http://rdf.ncbi.nlm.nih.gov/pubchem/ subdomain graph IRIs
    and adds the external ontologies in http://rdf.ncbi.nlm.nih.gov/pubchem/ruleset.
    Data edge scope, linked-object type context and ontology context must remain
  science_area: life sciences
